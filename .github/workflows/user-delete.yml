name: Daily cleanup

on:
  schedule:
    - cron: '0 21 * * *' # JST 06:00 = UTC 21:00(前日)
  workflow_dispatch:

jobs:
  delete-users:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.x'

      - name: Install dependencies
        run: npm ci

      - name: Run batch to delete users
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npx ts-node-esm ./batch/index.ts
