name: Daily cleanup

on:
  schedule:
    - cron: '0 21 * * *' # JST 06:00 = UTC 21:00(前日)
  workflow_dispatch:

jobs:
  delete-users:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - run: node -v
      - run: npx ts-node -v

      - name: Diagnose tsconfig
        run: |
          pwd
          ls -la
          echo "----- tsconfig.json -----"
          cat tsconfig.json
          echo "----- tsc noEmit -----"
          npx tsc -p tsconfig.json --noEmit

      - name: Run batch to delete users
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node --loader ts-node/esm ./batch/index.ts
